name: Siplite camera reader and control
on:
  pull_request:
    paths:
      - 'app-service/core/camera/**'
      - 'app-service/core/config.py'
      - 'app-service/create_api_app.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'app-service/core/schemas/device_tasks.py'
      - 'app-service/core/services/device_tasks.py'
      - 'app-service/core/services/device_events_collect.py'
      - 'app-service/core/crud/dev_tasks_repo.py'
      - 'app-service/core/crud/device_repo.py'
      - 'app-service/core/rpc_redaction.py'
      - 'app-service/core/remote_input/**'
      - 'app-service/api/**/device_tasks.py'
      - 'app-service/api/internal_v1/remote_input.py'
      - 'app-service/tests/**'
      - 'contracts/siplite-camera-v1/**'
      - 'docker-files/app-service/Dockerfile'
      - '.github/workflows/siplite-camera.yml'
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked
      - run: uv run python contracts/siplite-camera-v1/verify.py
      - run: uv run pytest -q app-service/tests/core/services/test_camera_negotiated.py app-service/tests/core/services/test_ip_camera_contract.py app-service/tests/core/services/test_rpc_result_lifecycle.py app-service/tests/core/remote_input
      - run: uvx ruff==0.15.5 check app-service/core/camera app-service/tests/core/services/test_camera_negotiated.py
      - run: uv run black --check app-service/core/camera app-service/tests/core/services/test_camera_negotiated.py
