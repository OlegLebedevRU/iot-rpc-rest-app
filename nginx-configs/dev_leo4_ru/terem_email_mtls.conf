# /etc/nginx/conf.d/terem_email_mtls.conf
#
# Strict mTLS upload endpoint for Terem email delivery:
# POST https://dev.leo4.ru:1443/terem-api/v1/send-email?file_name=PlaterraTerminal.log&email_address=user@example.com
# Request body: binary file content
# Client certificate: required, signed by /crt/ca_certificate.pem
# Device ID: extracted from client certificate subject OU

map $ssl_client_s_dn $terem_device_id {
    default "";
    ~(^|,)\s*OU=([^,/]+)(,|$) $2;
    ~(^|/)OU=([^/]+)(/|$) $2;
}

upstream terem_email_gateway {
    server d5dbnvm0kd5ames2tb0o.apigw.yandexcloud.net:443;
    zone terem_email_gateway_zone 64k;
    keepalive 16;
}

server {
    listen 1443 ssl;
    listen [::]:1443 ssl;
    server_name dev.leo4.ru;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /crt/server_certificate.pem;
    ssl_certificate_key /crt/server_key.pem;
    ssl_client_certificate /crt/ca_certificate.pem;
    ssl_trusted_certificate /crt/ca_certificate.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    client_max_body_size 25m;

    access_log /var/log/nginx/terem-email-mtls-access.log ssl_debug;
    error_log /var/log/nginx/terem-email-mtls-error.log notice;

    location = /terem-api/v1/send-email {
        auth_jwt_enabled off;

        if ($terem_device_id = "") {
            return 403 "Forbidden: client certificate OU is required\n";
        }

        proxy_pass https://terem_email_gateway/backend-api/v1/send-email/$terem_device_id$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host d5dbnvm0kd5ames2tb0o.apigw.yandexcloud.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Subject $ssl_client_s_dn;
        proxy_set_header X-Device-Id $terem_device_id;
        proxy_ssl_server_name on;
        proxy_ssl_name d5dbnvm0kd5ames2tb0o.apigw.yandexcloud.net;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
