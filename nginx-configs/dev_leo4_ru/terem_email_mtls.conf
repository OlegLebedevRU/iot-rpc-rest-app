# /etc/nginx/conf.d/terem_email_mtls.conf
#
# 1443: strict/general mTLS upload endpoint for Terem email delivery.
# 1444: Windows Schannel-friendly TLS 1.2 profile with explicit RSA ciphers.
# 1445: reserved for optional embedded/mbedTLS profile (not enabled by default).
#
# Example (Windows OpenSSL):
# openssl s_client -connect dev.leo4.ru:1444 -servername dev.leo4.ru -cert cert.pem -key key.pem -CAfile ca.crt
#
# Example request:
# POST https://dev.leo4.ru:1443/terem-api/v1/send-email?file_name=PlaterraTerminal.log&email_address=user@example.com
# Request body: binary file content
# Client certificate: required, signed by /crt/ca_certificate.pem
# Device ID: extracted from client certificate subject OU

map $ssl_client_s_dn $terem_device_id {
    default "";
    ~(^|,)\s*OU=([^,/]+)(,|$) $2;
    ~(^|/)OU=([^/]+)(/|$) $2;
}

upstream terem_email_gateway {
    server d5dbnvm0kd5ames2tb0o.apigw.yandexcloud.net:443;
    zone terem_email_gateway_zone 64k;
    keepalive 16;
}

server {
    # strict/general profile (TLS 1.2 + 1.3)
    listen 1443 ssl;
    listen [::]:1443 ssl;
    server_name dev.leo4.ru;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /crt/server_certificate.pem;
    ssl_certificate_key /crt/server_key.pem;
    ssl_client_certificate /crt/ca_certificate.pem;
    ssl_trusted_certificate /crt/ca_certificate.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    client_max_body_size 25m;

    access_log /var/log/nginx/terem-email-mtls-access.log ssl_debug;
    error_log /var/log/nginx/terem-email-mtls-error.log notice;

    location = /terem-api/v1/send-email {
        include /etc/nginx/conf.d/terem_email_proxy.inc;
    }
}

server {
    # Windows Schannel-friendly profile (TLS 1.2, explicit RSA suites)
    listen 1444 ssl;
    listen [::]:1444 ssl;
    server_name dev.leo4.ru;

    ssl_protocols TLSv1.2;
    # Keep RSA AES*-GCM fallback suites for legacy Schannel handshakes where ECDHE negotiation fails.
    # Trade-off: RSA key exchange fallback does not provide forward secrecy; keep for compatibility only.
    ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_certificate /crt/server_certificate.pem;
    ssl_certificate_key /crt/server_key.pem;
    ssl_client_certificate /crt/ca_certificate.pem;
    ssl_trusted_certificate /crt/ca_certificate.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    client_max_body_size 25m;

    access_log /var/log/nginx/terem-email-mtls-access.log ssl_debug;
    error_log /var/log/nginx/terem-email-mtls-error.log notice;

    location = /terem-api/v1/send-email {
        include /etc/nginx/conf.d/terem_email_proxy.inc;
    }
}

# 1445 reserved for optional embedded/mbedTLS profile if needed later.
# Keep disabled by default to avoid exposing an unnecessary public ingress.
#
# Example disabled template:
# server {
#     listen 1445 ssl;
#     listen [::]:1445 ssl;
#     server_name dev.leo4.ru;
#     ssl_protocols TLSv1.2;
#     ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
#     # Reuse the same mTLS certs/settings and location include as 1443/1444 when enabling.
# }
