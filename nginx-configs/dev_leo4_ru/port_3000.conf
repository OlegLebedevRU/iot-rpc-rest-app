server {
    listen 3000 ssl;
    server_name dev.leo4.ru;

    ssl_certificate /etc/nginx/ssl/live/dev.leo4.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/dev.leo4.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $menubuilder_upstream http://menubuilder-backend:8000;
    set $app1_upstream http://app1:8000;

    auth_jwt_enabled on;
    auth_jwt_algorithm RS256;
    auth_jwt_redirect off;
    auth_jwt_location COOKIE=accessToken;
    auth_jwt_key "-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqX393A/1A+OW9ISPrWbK
/qodWp7xMd0clA7VwGoOK6fW0Q0m7iwUoBk6PfyaUZPToIlMMn07x3OR3Idf9rdH
ZBTxYaIVBOTAC3/a9uLMi/ElLf8u1xxNffByUEbWL6lMViQgoSkxh2zLckSyvsyH
S2TMrSh4Lcq8d+QOVupgh/dOguLn8BXgVHgLtsrGJ7DqL78mwbJ6emp+LV+zeUot
xT03UwxmgFKr1AZnRGZI1Zp/xEUSYc1hX9ZzrF01jiNi1ln3NNxTqCWxpnlICxhh
QNF68AUG012qLnykaKak+9TclImCG+i+Giuj+Qc5B4j6J46kfLVZA/Ra64ugTbZy
nQIDAQAB
-----END PUBLIC KEY-----";

    location /api/auth/ {
        auth_jwt_enabled off;
        proxy_pass $menubuilder_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Org-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header jwt-sub "";
        proxy_set_header jwt-org "";
        proxy_set_header jwt-role "";
    }

    location /api/billing/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass $menubuilder_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $jwt_claim_userId;
        proxy_set_header X-Org-Id $jwt_claim_orgId;
        proxy_set_header X-User-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_roleId;
        proxy_set_header jwt-sub "";
        proxy_set_header jwt-org "";
        proxy_set_header jwt-role "";
    }

    location /api/mcp/ {
        auth_jwt_location HEADER=Authorization;
        auth_jwt_extract_var_claims jti sub;

        proxy_pass $menubuilder_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Auth-Jti $jwt_claim_jti;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location ~ ^/api/internal/v1/(devices|device-tasks|device-events|accounts)/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass $app1_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Service-Key "internal-service-key-dev";
        proxy_set_header orgId $jwt_claim_org;
        proxy_set_header X-Org-Id $jwt_claim_org;
        proxy_set_header jwt-org $jwt_claim_org;
        proxy_set_header X-User-Id $jwt_claim_sub;
        proxy_set_header jwt-sub $jwt_claim_sub;
        proxy_set_header X-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_role;
        proxy_set_header jwt-role $jwt_claim_role;
    }

    location /api/internal/v1/diagnostics/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass $app1_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Service-Key "internal-service-key-dev";
        proxy_set_header orgId $jwt_claim_org;
        proxy_set_header X-Org-Id $jwt_claim_org;
        proxy_set_header jwt-org $jwt_claim_org;
        proxy_set_header X-User-Id $jwt_claim_sub;
        proxy_set_header jwt-sub $jwt_claim_sub;
        proxy_set_header X-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_role;
        proxy_set_header jwt-role $jwt_claim_role;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Документация OpenAPI / Scalar / Swagger UI / ReDoc
    location ~ ^/(docs|openapi.json|redoc|swagger|legacy-docs) {
        auth_jwt_enabled off;
        proxy_pass $app1_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        auth_jwt_enabled off;
        proxy_pass $app1_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass $menubuilder_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $jwt_claim_userId;
        proxy_set_header X-Org-Id $jwt_claim_orgId;
        proxy_set_header X-User-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_roleId;
        proxy_set_header jwt-sub "";
        proxy_set_header jwt-org "";
        proxy_set_header jwt-role "";
    }

    location / {
        auth_jwt_enabled off;
        try_files $uri $uri/ /index.html;
    }
}
