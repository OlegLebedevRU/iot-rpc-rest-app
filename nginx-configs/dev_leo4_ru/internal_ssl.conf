server {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;  # This enables TLSv1 protocols
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;
    listen 4443 ssl;
    listen [::]:4443 ssl;
    server_name dev.leo4.ru;
    resolver 127.0.0.11 valid=10s;
    set $backend2 http://app1:8000;
    access_log /var/log/nginx/ssl-mutual-access.log;
    error_log /var/log/nginx/ssl-mutual-error.log notice;

    # Сертификат сервера
    ssl_certificate /crt/legacy_cert_dev_leo4_ru.crt;
    ssl_certificate_key /crt/server_key.pem;

    # Полностью отключаем проверку, но принимаем сертификат
    #ssl_verify_client off;
    #ssl_verify_depth 1;
    ssl_verify_client optional_no_ca;

    # === Fix double /api/api/ prefix (terminal bug) ===
    location ~ ^/api/api/(.*)$ {
        return 301 /api/$1$is_args$args;
    }

    # === API MenuBuilder (ListMenuFile) ===
    location /api/ListMenuFile {
        proxy_pass http://menubuilder-backend:8000/api/ListMenuFile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_buffering off;
    }

    # === API Debug (processing-backend) ===
    location /api/debug/ {
        proxy_pass http://processing-backend:8000/api/debug/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Legacy licensebilling: /api/licensebilling/ → /api/licensebilling/check ===
    location = /api/licensebilling/ {
        proxy_pass http://processing-backend:8000/api/licensebilling/check$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Legacy GateGauge: /api/GateGauge/main.ashx → /api/gategauge ===
    location = /api/GateGauge/main.ashx {
        proxy_pass http://processing-backend:8000/api/gategauge$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Payment: /api/payment/ ===
    location /api/payment/ {
        proxy_pass http://processing-backend:8000/api/payment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Legacy TechGate: /api/techgate/etran.ashx → /api/techgate/{function} ===
    location ~ ^/api/techgate/etran\.ashx$ {
        proxy_pass http://processing-backend:8000/api/techgate$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Certificates: /api/certificates/ (PIN-based, no cert headers) ===
    location ~ ^/api/certificates(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/certificates$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # === API Processing Backend (new format) ===
    location ~ ^/api/(licensebilling|gategauge|techgate)(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/$1$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    location /ssl-mutual-test/ {
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $backend2/api/v1/devices/map_legacy_crt/;
        proxy_redirect off;
    }

    location = /ssl-debug {
        return 200 "
        Client Cert: $ssl_client_escaped_cert
        ";
        add_header Content-Type text/plain;
    }

    # =====================================================================
    # Легаси-эндпоинты терминала (не /api/*) — прямой проброс на реальный
    # легаси IIS-сервер по его публичному IP (46.38.51.114). Проброс на
    # IP, а не на домен iot-processing.ru, специально: после переключения
    # DNS этого домена на nginx-mutual проксирование на сам домен привело
    # бы к петле (nginx проксировал бы сам на себя). VPN/туннель к
    # внутреннему адресу легаси-сервера (172.17.100.8) отсутствует,
    # поэтому используется публичный IP.
    #
    # Данные клиентского сертификата передаются заголовками X-Client-Cert-*
    # (как и в /api/*-роутах выше). На легаси-сервере их принимает и
    # разбирает ClientCertHelper (см. в репозитории etranprocessing:
    # BACK/ProcessingCore/EtranDispatcher/src, FRONT/TechGate/App_Code,
    # FRONT/GateGauge/App_Code, FRONT/licensebilling/App_Code) — но только
    # если запрос пришёл с адреса из TrustedProxyIP (см. корневой
    # web.config легаси-сервера, уже содержит адрес этой VM).
    #
    # ВАЖНО: SSL-биндинг на легаси-сервере полностью отключён (проверено:
    # внешние HTTPS-подключения на 443 сбрасываются на этапе TLS handshake
    # независимо от версии протокола/источника - похоже, HTTPS-биндинг снят
    # целиком). Поэтому проброс идёт по обычному http на порт 80, без TLS
    # между nginx и легаси-сервером. Данные клиентского сертификата
    # терминала (полученные nginx-mutual по mTLS от самого терминала)
    # всё равно передаются легаси-серверу через заголовки X-Client-Cert-*,
    # но уже без шифрования на этом отрезке (nginx-mutual -> легаси-сервер,
    # оба в пределах доверенной сети провайдера).
    location = /certificates/ {
        proxy_pass http://46.38.51.114/certificates/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /payment/ {
        proxy_pass http://46.38.51.114/payment/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /payment/etran.ashx {
        proxy_pass http://46.38.51.114/payment/etran.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /GateGauge/main.ashx {
        proxy_pass http://46.38.51.114/GateGauge/main.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /GateGauge/UpdateScript.ashx {
        proxy_pass http://46.38.51.114/GateGauge/UpdateScript.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /techgate/etran.ashx {
        proxy_pass http://46.38.51.114/techgate/etran.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /licensebilling/ {
        proxy_pass http://46.38.51.114/licensebilling/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    # Все остальные запросы -> реальный легаси-сервер (IP, см. комментарий
    # выше про причину использования IP вместо домена iot-processing.ru,
    # который после DNS cutover указывает на сам nginx-mutual).
    location / {
        proxy_pass http://46.38.51.114;
        proxy_redirect off;

        proxy_set_header X-Client-Cert-Serial   $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN       $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert      $ssl_client_escaped_cert;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
