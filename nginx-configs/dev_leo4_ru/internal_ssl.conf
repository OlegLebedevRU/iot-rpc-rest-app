map $ssl_client_s_dn $client_cert_dn_header {
    default $ssl_client_s_dn;
    "" $http_x_client_cert_dn;
}

map $ssl_client_serial $client_cert_serial_header {
    default $ssl_client_serial;
    "" $http_x_client_cert_serial;
}

map $ssl_client_i_dn $client_cert_issuer_dn_header {
    default $ssl_client_i_dn;
    "" $http_x_client_cert_issuer_dn;
}

map $ssl_client_verify $client_cert_verify_header {
    default $ssl_client_verify;
    "" $http_x_client_cert_verified;
}

map $ssl_client_escaped_cert $client_cert_raw_header {
    default $ssl_client_escaped_cert;
    "" $http_x_ssl_client_cert;
}

map $http_x_real_ip $client_real_ip_header {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;  # This enables TLSv1 protocols
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;
    listen 4443 ssl;
    listen [::]:4443 ssl;
    server_name dev.leo4.ru;
    resolver 127.0.0.11 valid=10s;
    access_log /var/log/nginx/ssl-mutual-access.log;
    error_log /var/log/nginx/ssl-mutual-error.log notice;

    # Сертификат сервера
    ssl_certificate /crt/legacy_cert_dev_leo4_ru.crt;
    ssl_certificate_key /crt/server_key.pem;

    # Полностью отключаем проверку, но принимаем сертификат
    #ssl_verify_client off;
    #ssl_verify_depth 1;
    ssl_verify_client optional_no_ca;

    # === API Debug (processing-backend) ===
    location /api/debug/ {
        proxy_pass http://processing-backend:8000/api/debug/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $client_cert_raw_header;
        proxy_set_header X-SSL-Client-Verify $client_cert_verify_header;
        proxy_set_header X-Client-Cert-DN $client_cert_dn_header;
        proxy_set_header X-Client-Cert-Serial $client_cert_serial_header;
        proxy_set_header X-Client-Cert-Issuer-DN $client_cert_issuer_dn_header;
        proxy_buffering off;
    }

    # === Legacy licensebilling: /api/licensebilling/ → /api/licensebilling/check ===
    location = /api/licensebilling/ {
        proxy_pass http://processing-backend:8000/api/licensebilling/check$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $client_cert_raw_header;
        proxy_set_header X-SSL-Client-Verify $client_cert_verify_header;
        proxy_set_header X-Client-Cert-DN $client_cert_dn_header;
        proxy_set_header X-Client-Cert-Serial $client_cert_serial_header;
        proxy_set_header X-Client-Cert-Issuer-DN $client_cert_issuer_dn_header;
        proxy_buffering off;
    }

    # === Payment: /api/payment ===
    location ~ ^/api/payment(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/payment$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $client_cert_raw_header;
        proxy_set_header X-SSL-Client-Verify $client_cert_verify_header;
        proxy_set_header X-Client-Cert-DN $client_cert_dn_header;
        proxy_set_header X-Client-Cert-Serial $client_cert_serial_header;
        proxy_set_header X-Client-Cert-Issuer-DN $client_cert_issuer_dn_header;
        proxy_buffering off;
    }

    # === TechGate: /api/techgate ===
    location ~ ^/api/techgate(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/techgate$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $client_cert_raw_header;
        proxy_set_header X-SSL-Client-Verify $client_cert_verify_header;
        proxy_set_header X-Client-Cert-DN $client_cert_dn_header;
        proxy_set_header X-Client-Cert-Serial $client_cert_serial_header;
        proxy_set_header X-Client-Cert-Issuer-DN $client_cert_issuer_dn_header;
        proxy_buffering off;
    }

    # === Certificates: /api/certificates/ (PIN-based, no cert headers) ===
    location ~ ^/api/certificates(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/certificates$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # === API Processing Backend (new format) ===
    location ~ ^/api/(licensebilling|gategauge)(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/$1$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $client_cert_raw_header;
        proxy_set_header X-SSL-Client-Verify $client_cert_verify_header;
        proxy_set_header X-Client-Cert-DN $client_cert_dn_header;
        proxy_set_header X-Client-Cert-Serial $client_cert_serial_header;
        proxy_set_header X-Client-Cert-Issuer-DN $client_cert_issuer_dn_header;
        proxy_buffering off;
    }


    # === Legacy map_legacy_crt: /ssl-mutual-test -> /api/v1/devices/map_legacy_crt/ ===
    location ~ ^/ssl-mutual-test/?$ {
        rewrite ^ /api/v1/devices/map_legacy_crt/ break;
        proxy_pass http://processing-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заголовки клиентского сертификата для mTLS auth в ProcessingBackend
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-Issuer-DN $ssl_client_i_dn;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;

        proxy_buffering off;
        proxy_redirect off;
    }

    location = /ssl-debug {
        return 200 "
        Client Cert: $ssl_client_escaped_cert
        ";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
