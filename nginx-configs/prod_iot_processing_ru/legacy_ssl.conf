server {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;  # This enables TLSv1 protocols
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name iot-processing.ru;
    access_log /var/log/nginx/ssl-mutual-access.log;
    error_log /var/log/nginx/ssl-mutual-error.log;

    # Сертификат сервера. Самоподписанный/временный (см. docs/deploy-plan.md
    # и devops-runbook.md) - терминалы не валидируют этот сертификат строго
    # (уже так на прежнем прямом флоу к легаси-серверу, известный и
    # допустимый фактор в рамках данной задачи), поэтому Let's Encrypt не
    # обязателен для запуска, но может быть добавлен позже.
    ssl_certificate /crt/iot-processing-ru-selfsigned.crt;
    ssl_certificate_key /crt/iot-processing-ru-selfsigned.key;

    # Полностью отключаем проверку клиентского сертификата на уровне nginx,
    # но всё равно его принимаем, чтобы можно было передать его данные
    # легаси-серверу через заголовки X-Client-Cert-* (см. ClientCertHelper
    # в репозитории etranprocessing).
    ssl_verify_client optional_no_ca;

    location = /ssl-debug {
        return 200 "
        Client Cert: $ssl_client_escaped_cert
        ";
        add_header Content-Type text/plain;
    }

    # === Legacy ListMenuFile (real production consumer) ===
    # The terminal actually calls the real legacy Windows service
    # PlaterraApiFrontService (D:\repo\platerra\PlaterraSoft\Processing\
    # PlaterraApiServices\PlaterraApiFrontService), not the new Python
    # MenuBuilder stack - a previous version of this location wrongly
    # double-hopped to the Python backend via the other nginx-mutual
    # instance (176.108.247.249). No X-Client-Cert-* headers are needed
    # here: the terminal itself already sends an "Authorization:
    # clientCertificate <base64>" header carrying the certificate data
    # (see Platerra.Terminal.BLL/Classes/clsMenuCreator.cs and
    # PlaterraApiFrontService/HostApi/APIKeyAuthenticationMiddleware.cs),
    # and nginx forwards the Authorization header through untouched by
    # default - so a plain pass-through proxy is all that's needed.
    location /api/ListMenuFile {
        proxy_pass http://46.38.51.114/api/ListMenuFile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # =====================================================================
    # Легаси-эндпоинты терминала — прямой проброс на реальный легаси
    # IIS-сервер по его публичному IP (46.38.51.114). Проброс на IP, а не
    # на домен iot-processing.ru, специально: этот домен теперь указывает
    # на этот же хост (DNS cutover), поэтому проксирование на сам домен
    # привело бы к петле (nginx проксировал бы сам на себя). VPN/туннель к
    # внутреннему адресу легаси-сервера (172.17.100.8) отсутствует, поэтому
    # используется публичный IP.
    #
    # Данные клиентского сертификата передаются заголовками X-Client-Cert-*.
    # На легаси-сервере их принимает и разбирает ClientCertHelper (см. в
    # репозитории etranprocessing: BACK/ProcessingCore/EtranDispatcher/src,
    # FRONT/TechGate/App_Code, FRONT/GateGauge/App_Code,
    # FRONT/licensebilling/App_Code) — но только если запрос пришёл с
    # адреса из TrustedProxyIP (см. корневой web.config легаси-сервера,
    # должен содержать публичный адрес этого хоста).
    #
    # ВАЖНО: SSL-биндинг на легаси-сервере полностью отключён (сайт
    # обслуживает как http, так и https раньше требовал клиентский
    # сертификат; сейчас проверено, что внешние HTTPS-подключения на 443
    # сбрасываются на этапе TLS handshake независимо от версии протокола и
    # источника - похоже, HTTPS-биндинг снят целиком). Поэтому проброс идёт
    # по обычному http на порт 80, без TLS между nginx и легаси-сервером.
    # Данные клиентского сертификата терминала (полученные nginx-mutual по
    # mTLS от самого терминала) всё равно передаются легаси-серверу через
    # заголовки X-Client-Cert-*, но уже без шифрования на этом отрезке
    # (nginx-mutual -> легаси-сервер, оба в пределах доверенной сети
    # провайдера) - см. ClientCertHelper в репозитории etranprocessing.
    location = /certificates/ {
        proxy_pass http://46.38.51.114/certificates/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /payment/ {
        proxy_pass http://46.38.51.114/payment/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /payment/etran.ashx {
        proxy_pass http://46.38.51.114/payment/etran.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /GateGauge/main.ashx {
        proxy_pass http://46.38.51.114/GateGauge/main.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /GateGauge/UpdateScript.ashx {
        proxy_pass http://46.38.51.114/GateGauge/UpdateScript.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /techgate/etran.ashx {
        proxy_pass http://46.38.51.114/techgate/etran.ashx$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    location = /licensebilling/ {
        proxy_pass http://46.38.51.114/licensebilling/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    # Все остальные запросы -> реальный легаси-сервер (IP, см. комментарий
    # выше про причину использования IP вместо домена iot-processing.ru).
    location / {
        proxy_pass http://46.38.51.114;
        proxy_redirect off;

        proxy_set_header X-Client-Cert-Serial   $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN       $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert       $ssl_client_escaped_cert;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
