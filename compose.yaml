  #    - ./avahi-services:/etc/avahi/services:ro
  #  restart: always
configs:
  plugins:
    content: "[rabbitmq_management, rabbitmq_mqtt, rabbitmq_event_exchange]."
volumes:
  pgdata:
  rabbitmq_data:
    driver: local

networks:
  rabbitmq_network:
    driver: bridge
  pg_network:
    driver: bridge
