services:
  app1:
    image: ghcr.io/oleglebedevru/iot-rpc-rest-app/app-service:${IMAGE_TAG:-latest}
    build:
      dockerfile: ./docker-files/app-service/Dockerfile
      context: ./
    # См. docs/deploy-plan.md §6.2: при `docker compose pull` (Build only)
    # внутри образа из GHCR нет /app/.env, поэтому пробрасываем переменные
    # окружения из ./app-service/.env (файл не коммитится в git).
    env_file:
      - ./app-service/.env
    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync+restart
          path: app-service
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock
    depends_on:
        pg:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
    container_name: app1
    networks:
      - rabbitmq_network
      - pg_network
    volumes:
      - ./logs:/var/log/app
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "5672:5672" # RabbitMQ AMQP export port alfa stage only, todo intranet only
    environment:
      RABBITMQ_HOST: '%'
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
    configs:
      - source: plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - type: bind
        source: ./rmq/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
      - type: bind
        source: ./rmq/definitions.json
        target: /etc/rabbitmq/definitions.json
        read_only: true
        # certs
      - type: bind
        source: ./crt/iot_leo4_ca.crt
        target: /crt/ca_certificate.pem
        read_only: true
      - type: bind
        source: ./crt/cert_0000.pem
        target: /crt/server_certificate.pem
        read_only: true
      - type: bind
        source: ./crt/key_0000.pem
        target: /crt/server_key.pem
        read_only: true
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      retries: 3
      timeout: 5s
      interval: 30s
  pg:
    image: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpass
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - pg_network
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: info@platerra.ru
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - pg_network

  nginx-mutual:
    image: ghcr.io/oleglebedevru/iot-rpc-rest-app/nginx-mutual:${IMAGE_TAG:-latest}
    build:
      dockerfile: ./docker-files/nginx-mutual/Dockerfile
      context: ./
    ports:
      - "4443:4443"
    restart: always
    # Секретные сертификаты в образ НЕ запекаются (их нет в репозитории и в
    # build-context CI). Пробрасываем их bind-mount’ом из ./crt/ на VM —
    # по аналогии с сервисом `nginx`. См. docs/deploy-plan.md §6.
    volumes:
      - ./crt/legacy_cert_dev_leo4_ru.crt:/crt/legacy_cert_dev_leo4_ru.crt:ro
      - ./crt/key_0000.pem:/crt/server_key.pem:ro

    networks:
      - rabbitmq_network
      - pg_network
    depends_on:
      - app1

  nginx:
    image: nginx:alpine
    container_name: iot-rpc-rest-app-nginx-1
    ports:
        - "80:80"
        - "443:443"
        - "1443:1443"
        - "1444:1444"
    restart: always
    volumes:
      - ./nginx-configs/dev_leo4_ru/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-configs/dev_leo4_ru/terem_email_mtls.conf:/etc/nginx/conf.d/terem_email_mtls.conf:ro
      - ./nginx-configs/dev_leo4_ru/snippets/terem_email_proxy.inc:/etc/nginx/conf.d/terem_email_proxy.inc:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
      - ./crt/iot_leo4_ca.crt:/crt/ca_certificate.pem:ro
      - ./crt/cert_0000.pem:/crt/server_certificate.pem:ro
      - ./crt/key_0000.pem:/crt/server_key.pem:ro
    networks:
      - rabbitmq_network
      - pg_network
    depends_on:
      - app1

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

# docker compose run --rm certbot certonly --webroot --webroot-path /var/www/certbot/ -d dev.leo4.ru
# docker compose run --rm certbot renew


